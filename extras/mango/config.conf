monitor_rule=name:.*,width:1920,height:1080,refresh:99.93,x:0,y:0,scale:1,primary:1,vrr:0

xkb_rules_layout=us,ru
xkb_rules_options=grp:alt_shift_toggle
repeat_rate=35
repeat_delay=250
numlock_on=1
tag_num=9

tag_rule=id:*,layout_name:dwindle
dwindle_preserve_split=1
dwindle_smart_split=0
dwindle_smart_resize=0

gap_inner_horizontal=4
gap_inner_vertical=4
gap_outer_horizontal=5
gap_outer_vertical=5
border_px=1
border_radius=18
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

blur=1
blur_layer=1
blur_optimized=1
blur_params_radius=10
blur_params_num_passes=3
blur_params_noise=0.05
blur_params_brightness=1.0
blur_params_contrast=0.89
blur_params_saturation=1.0

shadows=1
layer_shadows=0
shadow_only_floating=1
shadows_size=20
shadows_blur=10
shadows_position_x=0
shadows_position_y=2
shadows_color=0x00000020

dim_enable=1
dim_focused_color=0x00000000
dim_unfocused_color=0x0000000d
special_dim=0.2
special_gap_inner_horizontal=4
special_gap_inner_vertical=4
special_gap_outer_horizontal=30
special_gap_outer_vertical=30

animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
layer_animation_type_open=zoom
layer_animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
fade_in_begin_opacity=0.0
fade_out_begin_opacity=1.0
zoom_initial_ratio=0.8
zoom_end_ratio=0.9
animation_duration_open=300
animation_duration_move=300
animation_duration_close=200
animation_duration_tag=700
animation_duration_focus=1000
animation_curve_open=0.05,0.7,0.1,1
animation_curve_move=0.05,0.7,0.1,1
animation_curve_close=0.05,0.7,0.1,1
animation_curve_tag=0.1,1,0,1
animation_curve_focus=0.05,0.7,0.1,1
animation_curve_opacity_fade_in=0.05,0.7,0.1,1
animation_curve_opacity_fade_out=0.05,0.7,0.1,1
tag_animation_direction=1

focus_on_activate=1
sloppy_focus=1
warp_cursor=0
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=1
snap_distance=5
allow_tearing=1
xwayland_ignore_scale=1
enable_border_resize=1
cursor_theme=Bibata-Modern-Classic
cursor_size=24
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_click_method=2
trackpad_scroll_factor=0.7
gesture_live=1
gesture_swipe_distance=700
gesture_swipe_cancel_ratio=0.2
gesture_swipe_min_speed_to_force=5

source=./colors.conf

var=qsConfig,dotfiles

env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=XDG_DATA_DIRS,/home/aiden/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share
env=QT_QPA_PLATFORM,wayland;xcb
env=XDG_MENU_PREFIX,plasma-
env=DOTFILES_VIRTUAL_ENV,/home/aiden/.local/state/quickshell/.venv
env=qsConfig,dotfiles

exec_once=/home/aiden/.config/mango/autostart.sh

window_rule=is_floating:1,title:^(Open File)
window_rule=is_floating:1,title:^(Select a File)
window_rule=is_floating:1,width:0.6,height:0.65,title:^(Choose wallpaper)
window_rule=is_floating:1,title:^(Open Folder)
window_rule=is_floating:1,title:^(Select the mod file to import)
window_rule=is_floating:1,title:^(Save As)
window_rule=is_floating:1,title:^(Library)
window_rule=is_floating:1,title:^(File Upload)
window_rule=is_floating:1,title:^(.*)(wants to save)$
window_rule=is_floating:1,title:^(.*)(wants to open)$
window_rule=is_floating:1,app_id:^blueberry\.py$
window_rule=is_floating:1,app_id:^guifetch$
window_rule=is_floating:1,width:0.45,height:0.45,app_id:^pavucontrol$
window_rule=is_floating:1,width:0.45,height:0.45,app_id:^org.pulseaudio.pavucontrol$
window_rule=is_floating:1,width:0.45,height:0.45,app_id:^nm-connection-editor$
window_rule=is_floating:1,app_id:.*plasmawindowed.*
window_rule=is_floating:1,app_id:^kcm_.*
window_rule=is_floating:1,title:.*Welcome
window_rule=is_floating:1,title:^(dotfiles Settings)$
window_rule=is_floating:1,title:.*Shell conflicts.*
window_rule=is_floating:1,width:0.45,height:0.45,app_id:^Zotero$
window_rule=is_floating:1,app_id:^org\.gnome\.Nautilus$
window_rule=is_floating:0,app_id:^dev\.warp\.Warp$
window_rule=is_floating:1,width:0.25,height:0.25,offset_x:71,offset_y:69,is_global:1,title:^([Pp]icture[- ]?[Ii]n[- ]?[Pp]icture)
window_rule=is_floating:1,is_global:1,offset_y:95,title:.*is sharing (a window|your screen).*
window_rule=force_tearing:1,title:.*\.exe
window_rule=force_tearing:1,title:.*minecraft.*
window_rule=force_tearing:1,app_id:^(steam_app).*
window_rule=no_blur:1,app_id:.*

layer_rule=no_animation:1,layer_name:^(selection|overview|osk|hyprpicker|indicator.*|noanim|walker|anyrun)$
layer_rule=no_animation:1,layer_name:^(gtk4-layer-shell|gtk-layer-shell)$
layer_rule=animation_type_open:slide,animation_type_close:slide,layer_name:^quickshell:(bar|cheatsheet|dock|osk|reloadPopup|sidebarRight|aiChat|verticalBar|wallpaperSelector)$
layer_rule=no_animation:1,layer_name:^quickshell:screenCorners$
layer_rule=animation_type_open:fade,animation_type_close:fade,layer_name:^quickshell:notificationPopup$
layer_rule=no_animation:1,layer_name:^quickshell:(actionCenter|lockWindowPusher|overlay|overview|polkit|regionSelector|screenshot|session)$
layer_rule=no_blur:1,layer_name:^(quickshell:background|selection|overview|walker|anyrun|osk|hyprpicker)$
layer_rule=animation_type_open:slide,animation_type_close:slide,layer_name:^(sideleft|sideright).*

bind=SUPER,Space,spawn_shell,qs -c $qsConfig ipc call search toggle
bind=SUPER,N,spawn_shell,qs -c $qsConfig ipc call sidebarRight toggle
bind=SUPER,V,spawn_shell,qs -c $qsConfig ipc call search clipboardToggle
bind=SUPER,O,spawn_shell,qs -c $qsConfig ipc call aiChat toggle
bind=SUPER,slash,spawn_shell,qs -c $qsConfig ipc call cheatsheet toggle
bind=SUPER,G,spawn_shell,qs -c $qsConfig ipc call overlay toggle
bind=CTRL+ALT,Delete,spawn_shell,qs -c $qsConfig ipc call session toggle
bind=SUPER,J,spawn_shell,qs -c $qsConfig ipc call bar toggle
bind=SHIFT+SUPER+ALT,slash,spawn_shell,qs -p $HOME/.config/quickshell/$qsConfig/welcome.qml
bind=NONE,XF86MonBrightnessUp,spawn_shell,qs -c $qsConfig ipc call brightness increment || brightnessctl s 5%+
bind=NONE,XF86MonBrightnessDown,spawn_shell,qs -c $qsConfig ipc call brightness decrement || brightnessctl s 5%-
bind=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ -l 1.5
bind=NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bind=CTRL+SUPER,T,spawn_shell,qs -c $qsConfig ipc call wallpaperSelector toggle || $HOME/.config/quickshell/$qsConfig/scripts/colors/switchwall.sh
bind=CTRL+SUPER+ALT,T,spawn_shell,$HOME/.config/mango/scripts/random-wallpaper.sh
bind=CTRL+SUPER+SHIFT,D,spawn_shell,qs -c $qsConfig ipc call theme toggleLightDark
bind=CTRL+SUPER,R,spawn_shell,killall ydotool qs quickshell; qs -c $qsConfig &
bind=SUPER+SHIFT,S,spawn_shell,qs -c $qsConfig ipc call region screenshot || grim -g "$(slurp)" - | wl-copy
bind=SUPER+SHIFT,A,spawn_shell,qs -c $qsConfig ipc call region search || $HOME/.config/hypr/hyprland/scripts/snip_to_search.sh
bind=SUPER+SHIFT,X,spawn_shell,qs -c $qsConfig ipc call region ocr || (grim -g "$(slurp)" /tmp/ocr_image.png && tesseract /tmp/ocr_image.png stdout | wl-copy && rm /tmp/ocr_image.png)
bind=SUPER+SHIFT,C,spawn_shell,hyprpicker -a
bindl=SUPER+SHIFT,R,spawn_shell,qs -c $qsConfig ipc call region record || $HOME/.config/mango/scripts/record.sh
bindl=SUPER+ALT,R,spawn_shell,qs -c $qsConfig ipc call region record || $HOME/.config/mango/scripts/record.sh
bindl=CTRL+ALT,R,spawn_shell,$HOME/.config/mango/scripts/record.sh
bindl=SUPER+SHIFT+ALT,R,spawn_shell,qs -c $qsConfig ipc call region recordWithSound || $HOME/.config/mango/scripts/record.sh --sound
bindl=NONE,Print,spawn_shell,grim - | wl-copy
bindl=CTRL,Print,spawn_shell,mkdir -p "$(xdg-user-dir PICTURES)/Screenshots" && f="$(xdg-user-dir PICTURES)/Screenshots/Screenshot_$(date '+%Y-%m-%d_%H.%M.%S').png" && grim "$f" && wl-copy < "$f"

bindl=SUPER+SHIFT,N,spawn_shell,playerctl next || playerctl position $(bc <<< "100 * $(playerctl metadata mpris:length) / 1000000 / 100")
