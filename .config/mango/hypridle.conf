general {
    lock_cmd = qs -c dotfiles ipc call lock activate
    before_sleep_cmd = qs -c dotfiles ipc call lock activate
    after_sleep_cmd = qs -c dotfiles ipc call lock focus
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = qs -c dotfiles ipc call lock activate
}

listener {
    timeout = 600
    on-timeout = mmsg dispatch sleep_toggle_monitor
    on-resume = mmsg dispatch sleep_toggle_monitor
}

listener {
    timeout = 900
    on-timeout = systemctl suspend || loginctl suspend
}
